<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu_book"
    />
  </head>
  <body>
    <header>
      <h1>My Library</h1>
    </header>
    <main>
      <button
        class="add-book-button"
        command="show-modal"
        commandfor="add-book-dialog"
      >
        Add book
      </button>

      <dialog id="add-book-dialog">
        <form action="" id="add-book-form">
          <label for="title">Title:</label>
          <input type="text" name="title" id="title" required />
          <label for="author">Author:</label>
          <input type="text" name="author" id="author" required />
          <label for="author">Number of pages:</label>
          <input
            type="number"
            name="number-of-page"
            id="number-of-page"
            required
          />
          <label for="read">Already read it ?</label>
          <input type="checkbox" name="read-it" id="read-it" />
        </form>
        <div class="buttons">
          <button type="summit" form="add-book-form">Add</button>
          <button command="close" commandfor="add-book-dialog">Cancel</button>
        </div>
      </dialog>

      <div class="bookshelfs">
        <div class="shelf"></div>
        <div class="shelf"></div>
        <div class="shelf"></div>
        <div class="shelf"></div>
        <div class="shelf"></div>
      </div>
      <div class="action-book hidden">
        <div class="drop-book-zone" id="read-book">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="75px"
            height="75px"
            fill="white"
          >
            <title>book-open-page-variant-outline</title>
            <path
              d="M19 1L14 6V17L19 12.5V1M21 5V18.5C19.9 18.15 18.7 18 17.5 18C15.8 18 13.35 18.65 12 19.5V6C10.55 4.9 8.45 4.5 6.5 4.5C4.55 4.5 2.45 4.9 1 6V20.65C1 20.9 1.25 21.15 1.5 21.15C1.6 21.15 1.65 21.1 1.75 21.1C3.1 20.45 5.05 20 6.5 20C8.45 20 10.55 20.4 12 21.5C13.35 20.65 15.8 20 17.5 20C19.15 20 20.85 20.3 22.25 21.05C22.35 21.1 22.4 21.1 22.5 21.1C22.75 21.1 23 20.85 23 20.6V6C22.4 5.55 21.75 5.25 21 5M10 18.41C8.75 18.09 7.5 18 6.5 18C5.44 18 4.18 18.19 3 18.5V7.13C3.91 6.73 5.14 6.5 6.5 6.5C7.86 6.5 9.09 6.73 10 7.13V18.41Z"
            />
          </svg>
        </div>
        <div class="drop-book-zone" id="delete-book">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="75px"
            height="75px"
            fill="white"
          >
            <title>delete-outline</title>
            <path
              d="M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19M8,9H16V19H8V9M15.5,4L14.5,3H9.5L8.5,4H5V6H19V4H15.5Z"
            />
          </svg>
        </div>
      </div>
    </main>

    <footer>
      <p>
        A project from
        <a
          href="https://www.theodinproject.com/lessons/node-path-javascript-library"
          >The Odin Project.</a
        >
      </p>
    </footer>
  </body>
</html>
