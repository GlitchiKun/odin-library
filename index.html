<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>My Library</h1>
    </header>
    <main>
      <button
        class="add-book-button"
        command="show-modal"
        commandfor="add-book-dialog"
      >
        Add book
      </button>

      <dialog id="add-book-dialog">
        <form action="" id="add-book-form">
          <label for="title">Title:</label>
          <input type="text" name="title" id="title" />
          <label for="author">Author:</label>
          <input type="text" name="author" id="author" />
          <label for="author">Number of pages:</label>
          <input type="text" name="number-of-page" id="number-of-page" />
          <label for="read">Already read it ?</label>
          <input type="checkbox" name="read-it" id="read-it" />
        </form>
        <button type="summit" form="add-book-form">Add</button>
        <button command="close" commandfor="add-book-dialog">Cancel</button>
      </dialog>

      <div class="bookshelfs">
        <div class="shelf">
          <div id="the-lord-of-the-ring" class="book">
            The Lord of the ring<br />J.R.R Tolkien
          </div>
          <div id="harry-potter" class="book">
            Harry Potter <br />J.K Rowling
          </div>
          <div id="orwell-1984" class="book">1984 <br />Georges Orwell</div>
        </div>
        <div class="shelf"></div>
        <div class="shelf"></div>
        <div class="shelf"></div>
        <div class="shelf"></div>
      </div>
    </main>
    <footer>
      <p>
        A project from
        <a
          href="https://www.theodinproject.com/lessons/node-path-javascript-library"
          >The Odin Project.</a
        >
      </p>
    </footer>
  </body>
</html>
